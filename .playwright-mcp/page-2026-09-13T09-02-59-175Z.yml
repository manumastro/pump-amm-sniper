  - generic [ref=f3e2]:
    - generic [ref=f3e3]:
      - heading "GMGN.AI | The Fastest Multi-Chain Meme Trading Terminal" [level=2] [ref=f3e4]
      - paragraph [ref=f3e5]: GMGN.AI is a MEME token trading platform supporting Solana, BSC, Base, and Ethereum — covering new token monitoring, security auditing, holder analysis, smart money copy trading, wallet P&L analytics, and automated trade execution, widely used for early-stage on-chain project discovery and quantitative trading.
      - heading "Core Features" [level=3] [ref=f3e6]
      - list [ref=f3e7]:
        - listitem [ref=f3e8]:
          - strong [ref=f3e9]: Real-Time New Token Monitoring
          - paragraph [ref=f3e10]: Continuously scans launchpads including Pump.fun, FourMeme, Raydium, and letsbonk with filters for market cap, volume, and creation time — helping users enter positions at early low-cap stages.
        - listitem [ref=f3e11]:
          - strong [ref=f3e12]: Live Trending Token Rankings
          - paragraph [ref=f3e13]: Leaderboard updated every minute based on buy/sell count, trading volume, price change, and holder growth — reflecting real-time market momentum and capital flow.
        - listitem [ref=f3e14]:
          - strong [ref=f3e15]: Token Holder Structure Analysis
          - paragraph [ref=f3e16]: "Real-time calculation of four key metrics: insider/rat wallet ratio, bundle buy ratio, DEV holdings %, and Top 10 wallet concentration."
        - listitem [ref=f3e17]:
          - strong [ref=f3e18]: Automated Token Security Audit
          - paragraph [ref=f3e19]: "Auto-checks every token for: LP burned status, honeypot detection, contract renounced status, and mintable flag."
        - listitem [ref=f3e20]:
          - strong [ref=f3e21]: Smart Money Copy Trading
          - paragraph [ref=f3e22]: Identifies high-win-rate wallets on-chain and enables one-click copy trading that automatically mirrors their buy/sell actions and position sizing.
        - listitem [ref=f3e23]:
          - strong [ref=f3e24]: KOL & Wallet Tracker with Real-Time Alerts
          - paragraph [ref=f3e25]: Custom watchlist with real-time push notifications for every on-chain event — buys, sells, position adds, and full exits — from tracked wallets and KOLs.
        - listitem [ref=f3e26]:
          - strong [ref=f3e27]: Zero-Latency Trading & Automated Strategies
          - paragraph [ref=f3e28]: Zero-latency on-chain trade execution with Take Profit, Stop Loss, Trailing Take Profit / Trailing Stop Loss, and multi-wallet batch order support.
        - listitem [ref=f3e29]:
          - strong [ref=f3e30]: Wallet P&L Analytics
          - paragraph [ref=f3e31]: "Enter any wallet address to instantly generate: realized/unrealized PnL, win rate and risk/reward ratio, current holdings valuation, full trade history, and developer wallet token creation records with all-time high (ATH) market cap per token."
        - listitem [ref=f3e32]:
          - strong [ref=f3e33]: Trading Data API & AI-Native Skills
          - paragraph [ref=f3e34]: Five structured API categories — token data, wallet data, market data, trade execution, and signal tracking — packaged as standardized AI Skills directly callable by Claude, GPT, and other AI Agents via natural language for on-chain data queries and trade execution.
